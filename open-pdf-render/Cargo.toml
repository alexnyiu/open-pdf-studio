[package]
name = "open-pdf-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure Rust PDF page renderer — renders PDF pages to RGBA bitmaps"

[dependencies]
lopdf = "0.34"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
turbojpeg = { version = "1", default-features = false, features = ["image", "cmake"] }
ttf-parser = "0.25"
rayon = "1"
hayro-font = "0.4.0"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
libloading = "0.8"
